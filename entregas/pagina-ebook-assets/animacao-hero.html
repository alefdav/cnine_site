<!--
  Animação da primeira tela (6 s em loop, sem JavaScript, ~4 KB).
  Duas planilhas entram e viram a tabela verde/laranja/vermelha.
  Dados vindos do resultado real do pedido 3 (planilhas de exemplo, dados fictícios).
  Para usar na página: copie o <style> e o <div class="hero-anim"> para o componente da primeira tela.
-->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animação da primeira tela</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .hero-anim { --ok:#1d7a4b; --ok-bg:#e3f4ea; --dif:#a8500a; --dif-bg:#fbebd9; --falta:#b4232a; --falta-bg:#fbe3e4;
    position: relative; width: min(360px, 92vw); aspect-ratio: 4 / 3; border-radius: 14px; background: #fff; border: 1px solid #dde2ea; overflow: hidden; font-size: 12px; }
  .hero-anim .sheet { position: absolute; top: 14%; width: 44%; padding: 6px; border-radius: 8px; border: 1px solid #c9d1dc; background: #f8fafc; display: grid; gap: 3px; }
  .hero-anim .sheet b { font-size: 10px; color: #5a6272; letter-spacing: .04em; text-transform: uppercase; }
  .hero-anim .sheet i { display: block; height: 7px; border-radius: 3px; background: #dfe5ee; }
  .hero-anim .s1 { left: 4%; animation: s1 6s infinite ease-in-out; }
  .hero-anim .s2 { right: 4%; animation: s2 6s infinite ease-in-out; }
  .hero-anim .result { position: absolute; inset: 8% 5%; display: grid; gap: 4px; align-content: start; opacity: 0; animation: res 6s infinite ease-in-out; }
  .hero-anim .row { display: grid; grid-template-columns: 1.1fr .8fr 1.5fr; gap: 6px; padding: 5px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; opacity: 0; animation: row 6s infinite; }
  .hero-anim .head { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #5a6272; opacity: 1; animation: none; }
  .hero-anim .ok { background: var(--ok-bg); color: var(--ok); }
  .hero-anim .dif { background: var(--dif-bg); color: var(--dif); }
  .hero-anim .falta { background: var(--falta-bg); color: var(--falta); }
  .hero-anim .row:nth-child(2) { animation-delay: .15s; } .hero-anim .row:nth-child(3) { animation-delay: .3s; }
  .hero-anim .row:nth-child(4) { animation-delay: .45s; } .hero-anim .row:nth-child(5) { animation-delay: .6s; }
  .hero-anim .row:nth-child(6) { animation-delay: .75s; }

  @keyframes s1 { 0%, 12% { transform: translateX(-120%); opacity: 0; } 25%, 38% { transform: translateX(0); opacity: 1; } 48%, 100% { transform: translateX(55%); opacity: 0; } }
  @keyframes s2 { 0%, 12% { transform: translateX(120%); opacity: 0; } 25%, 38% { transform: translateX(0); opacity: 1; } 48%, 100% { transform: translateX(-55%); opacity: 0; } }
  @keyframes res { 0%, 45% { opacity: 0; } 52%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes row { 0%, 50% { opacity: 0; transform: translateY(4px); } 58%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .hero-anim .sheet { display: none; }
    .hero-anim .result, .hero-anim .row { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="hero-anim" role="img" aria-label="Duas planilhas viram uma tabela: pedidos que batem em verde, diferentes em laranja e faltando em vermelho">
  <div class="sheet s1"><b>WMS</b><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sheet s2"><b>Transportadora</b><i></i><i></i><i></i><i></i><i></i></div>
  <div class="result">
    <div class="row head"><span>Pedido</span><span>NF</span><span>Resultado</span></div>
    <div class="row ok"><span>PV-48210</span><span>31500</span><span>✔ bate</span></div>
    <div class="row dif"><span>PV-48213</span><span>31503</span><span>⚠ peso +12 kg</span></div>
    <div class="row ok"><span>PV-48214</span><span>31504</span><span>✔ bate</span></div>
    <div class="row dif"><span>PV-48224</span><span>31514</span><span>⚠ volumes 2 → 4</span></div>
    <div class="row falta"><span>PV-48230</span><span>31520</span><span>✖ sem coleta</span></div>
  </div>
</div>

</body>
</html>
